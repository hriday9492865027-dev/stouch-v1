<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#031024" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle touch surface outline -->
  <rect x="80" y="80" width="352" height="352" rx="48" fill="#0b1329" fill-opacity="0.8" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#neonGlow)" />
  
  <!-- Dashed radar circle -->
  <circle cx="256" cy="240" r="88" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="240" r="12" fill="#22d3ee" />

  <!-- Touchpad click buttons divider -->
  <line x1="80" y1="352" x2="432" y2="352" stroke="#0ea5e9" stroke-width="3" opacity="0.4" />
  <line x1="256" y1="352" x2="256" y2="432" stroke="#0ea5e9" stroke-width="3" opacity="0.4" />

  <!-- Bold Stylized S in the center -->
  <text x="256" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="120" text-anchor="middle" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(34, 211, 238, 0.8))">S</text>
  
  <!-- Subtitle -->
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="4" text-anchor="middle" fill="#38bdf8" opacity="0.9">TOUCH</text>
</svg>
